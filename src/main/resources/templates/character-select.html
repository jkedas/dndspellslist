<!DOCTYPE html>
<html 	xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="http://thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>D&d Helper</title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
	<link href="/css/styles.css" rel="stylesheet"></link>
	<link href="/css/homepage-nav.css" rel="stylesheet"></link>
	<link href="/css/character-select.css" rel="stylesheet"></link>
</head>
<body>
		<div th:replace="~{fragments/homepage-nav :: homepage-nav(current='characters')}"></div>
		
		
		<div name="character-table-viewport" class="row ">
			<div class="col-1"></div>
			<div class="col-10 content-window">
				<h2>Characters</h2>
				
				<input id="searchbar" type="text" placeholder="Search..">
				<a name="create character" href="create-character">+ Create Character</a>
			    <div class="">
			        <table id="character-table" class="character-table">
			            <thead>
			                <tr>
			                    <th scope="col">Name</th>
			                    <th scope="col">Level</th>
			                    <th scope="col">Class</th>
			                    <th scope="col">Campaign</th>
			                </tr>
			            </thead>
			            <tbody th:each="character : ${characters}	"th:insert="~{fragments/character-row :: character-row}">
			            </tbody>
			        </table>
			    </div>
	    	</div>
	    	<div class="col-1"></div>
	    </div>
	    
	    <script src="/js/character-select.js"></script>
		<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
	</body>
</html>
