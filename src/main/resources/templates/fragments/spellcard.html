<html xmlns:th="http://thymeleaf.org">

<div th:fragment="spellcard"  class="spellcard col-lg-4 col-sm-12" th:name="${spell.getName()}">
	<div class="card-content">
		<div class="spell-name">
			<b><span th:text="${spell.getName()}"></span></b>
		</div>
		<div class="spell-content row">
			<div class="col-lg-12 col-sm-12" name="level-school"><em><span th:text="${spell.getLevel()}"></span> <span th:text="${spell.getSchool()}"></span></em></div>
			<div class="col-lg-6 col-sm-12" name="casting-time"><b>Casting Time: </b><span th:text="${spell.getCasting_time()}"> </span><span th:text="${spell.getRitual()}"></span></div>
			<div class="col-lg-6 col-sm-12" name="range"><b>Range: </b><span th:text="${spell.getSpell_range()}"></span></div>
			<div class="col-lg-6 col-sm-12" name="components"><b>Components: </b><span th:text="${spell.getMaterial_components()}"> </span> <span th:text="${spell.getMaterial()}"></span></div>
			<div class="col-lg-6 col-sm-12" name="duration"><b>Duration: </b><span th:text="${spell.getDuration()}"></span></div>
			<hr class="col-12" style="border-top: solid;">
			<div class="col-lg-12 col-sm-12 mt-1" name="description"><span th:text="${spell.getDetails()}"></span></div>
		</div>
	</div>
</div>

<div th:fragment="spellcard-popup"  class="spellcard" th:name="${spell.getName()}">
	<div class="card-content">
		<div>
			<span th:text="${spell.getName()}" class="spell-name"></span>
			
			<button type="button" class="close-btn"><span>&times</span></button>
		</div>
		


		<div class="spell-content row">
			<div class="col-lg-12 col-sm-12" name="level-school"><em><span th:text="${spell.getLevel()}"></span> <span th:text="${spell.getSchool()}"></span></em></div>
			<div class="col-lg-6 col-sm-12" name="casting-time"><b>Casting Time: </b>1 <span th:if="${spell.getCasting_time()}"></span><span th:if="${spell.getRitual() == true}">, <em>Ritual</em></span></div>
			<div class="col-lg-6 col-sm-12" name="range"><b>Range: </b><span th:text="${spell.getSpell_range()}"></span></div>
			<div class="col-lg-6 col-sm-12" name="components"><b>Components: </b><span th:if="${spell.getVerbal() == true}">V</span><span th:if="${spell.getSomatic() == true}">S</span><span th:if="${spell.getMaterial() == true}">M (<span th:text="${spell.getMaterial_components()}"><span th:if="${spell.getMaterial_consumed == true}">, all of which the spell consumes</span></span>)</span></div>
			<div class="col-lg-6 col-sm-12" name="duration"><b>Duration: </b><span th:text="${spell.getDuration()}"></span></div>
			<hr class="col-lg-12 col-sm-12" style="border-top: solid;">
			<div class="col-lg-12 col-sm-12 mt-1" name="description"><span th:text="${spell.getDetails()}"></span></div>
			<div class="col-lg-12 col-sm-12" name="higher_levels"><b>At Higher Levels: </b><span th:text="${spell.getHigher_levels()}"></span></div>
		</div>
	</div>
</div>
